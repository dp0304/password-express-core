# SPDX-License-Identifier: Apache-2.0
[package]
name = "aipass-ffi"
description = "AI Pass uniffi bindings (Swift module AIPassCore, Kotlin package com.aipass.core)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[features]
default = []
# Builds the `uniffi-bindgen` helper binary (bindings generation only; not shipped).
bindgen = ["uniffi/cli"]
# Exposes `TestExecutor` (a fake broker / executor) for host tests. Never ship it.
test-support = []

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
aipass-types.workspace = true
aipass-crypto.workspace = true
aipass-vault.workspace = true
aipass-storage.workspace = true
aipass-sync.workspace = true
uniffi.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
zeroize.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
# real-relay integration test: an in-process aipass-node (broker + executor + relay)
aipass-node.workspace = true
aipass-client.workspace = true

# FFI scaffolding generated by uniffi needs unsafe, so the workspace lint table
# (unsafe_code = "deny") is intentionally not inherited; clippy lints are set in-crate.

[[test]]
name = "real_relay"
path = "tests/real_relay.rs"

[[test]]
name = "ffi"
path = "tests/ffi.rs"
required-features = ["test-support"]
